# Entry 06 N·L diffuse working

## What happened

The surface now responds to light. Moving the mouse  the environment brightens where the light hits, falls off where it doesn't. The edges of the height map hill catch the light differently depending on angle. This is not a fake gradient. This is physically-based Lambertian diffuse reflectance running in real time on the GPU.


**Screen recording:** `Screen Recording 2026-04-28 at 1.50.20 PM.mov`![[Screen Recording 2026-04-28 at 1.50.20 PM.mov]]
---

## What changed

Two files. Minimal changes.

**`sobel.frag`  one new uniform, replace the last line:**

Added at the top:
```glsl
uniform vec2 uMouse;
```

Replaced `gl_FragColor = vec4(normal * 0.5 + 0.5, 1.0);` with:
```glsl
vec3 lightPos = vec3(uMouse, 0.5);
vec3 lightDir = normalize(lightPos - vec3(vTexCoord, 0.0));

float NdotL = max(dot(normal, lightDir), 0.0);

float dist = length(uMouse - vTexCoord);
float attenuation = 1.0 / (1.0 + 6.0 * dist * dist);

float brightness = 0.08 + NdotL * attenuation;
gl_FragColor = vec4(vec3(brightness), 1.0);
```

**`main.js`  one new line inside `draw()`:**
```javascript
myShader.setUniform('uMouse', [mouseX / width, mouseY / height]);
```

---

## The math  where each line comes from

### `vec3 lightPos = vec3(uMouse, 0.5)`

The mouse is a 2D coordinate in UV space (0→1 in X and Y). To compute a 3D light direction, we need to give the light a Z position: how far above the surface it floats. Z = 0.5 is a fixed elevation: halfway between the surface plane (Z = 0) and the camera.

### `vec3 lightDir = normalize(lightPos - vec3(vTexCoord, 0.0))`

Light direction = the vector pointing from the current pixel toward the light. Subtracting pixel position from light position gives that arrow. `normalize()` makes it length 1, required for the dot product to give a clean cosine value.

### `float NdotL = max(dot(normal, lightDir), 0.0)`

This is the core formula of Lambertian diffuse reflectance.

**From [1] Akenine-Möller et al., *Real-Time Rendering*, 4th ed., Ch. 9:**

> L_o = c_diff × max(0, **n** · **l**)

Where:
- **n** = surface normal (unit vector pointing away from the surface)
- **l** = direction to the light (unit vector)
- `dot(n, l)` = cos(θ), the cosine of the angle between them
- θ = 0° (surface faces directly toward the light) → cos(0°) = 1.0 → maximum brightness
- θ = 90° (surface parallel to light) → cos(90°) = 0.0 → no contribution
- θ > 90° (surface faces away) → negative value → `max(0, ...)` clamps it to zero

The `max(0, ...)` is why surfaces facing away from the light go dark rather than negative. RTR calls this the *clamped cosine*.

This formula is from RTR Ch. 9.1 (basic diffuse model). It is also the equation that appears in the academic report as the primary lighting algorithm for this project.

### `float attenuation = 1.0 / (1.0 + 6.0 * dist * dist)`

Physical light follows the **inverse square law**: intensity drops with the square of distance. The full form is `1 / d²`. The modified form here (`1 / (1 + k*d²)`) prevents the singularity at d = 0 (which would give infinite brightness at the exact mouse position). The constant `6.0` controls how fast the light falls off across the UV space.

### `float brightness = 0.08 + NdotL * attenuation`

`0.08` is the **ambient term**: a minimum base light level so areas completely facing away from the light aren't pure black. In a real room there is always some indirect light bouncing off walls. `0.08` approximates that without running a full global illumination pass.

---

## What I now understand: why N·L matters for the project

In Entry 05, the shader output the normal as colour to verify it was correct. That purple-blue image was proof, but it was just a visualisation.

In this step, the normal is finally doing its job: telling each pixel how directly it faces the light. The same Sobel computation runs identically, but now the result feeds into `dot(normal, lightDir)` instead of into the colour output.

This is the difference between having data and using data.

The full N·L formula in the project context:
```
surface_brightness = ambient + dot(N_from_sobel, L_to_mouse) × distance_attenuation
```

The three components:
1. **N from Sobel**: derived procedurally this session, from the height map gradient
2. **L to mouse**: the mouse-as-point-light pipeline proven in Entry 04
3. **Distance attenuation**: inverse square falloff, same physical model used in real renderers

All three pieces existed separately in earlier sessions. This is the first time they combine.

---

## Why this is the academic contribution

The professor asked for: procedural normal derivation in the shader. What we now have:

1. A greyscale height map goes in
2. The Sobel filter computes the surface gradient live in the shader
3. The gradient becomes a normal vector
4. The normal vector feeds N·L diffuse
5. The surface responds physically to a point light

No hand-painted normal map. No Sprite Illuminator. No pre-baked data. The normals are computed from mathematics, every frame, in real time. This is exactly what [1] RTR Ch. 9 describes as the foundation of real-time lighting, and the professor's feedback confirmed this is the A-grade technical contribution.

---
