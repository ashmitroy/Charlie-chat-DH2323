<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Let Me Ask Charlie</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        background: #0b0c10;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }

      canvas { display: block; }

      /* ── Game canvas + overlays ────────────────────────── */
      #game-container {
        position: relative;
        width: 960px;
        height: 540px;
      }

      /* ── Dialogue box (Undertale-style) ────────────────── */
      #dialogue {
        position: absolute;
        left: 24px;
        right: 24px;
        bottom: 20px;
        min-height: 70px;
        background: #0a0a0c;
        border: 2px solid #e5e5e5;
        padding: 12px 16px;
        font-family: 'Courier New', Courier, monospace;
        font-size: 0.85rem;
        color: #eaeaea;
        line-height: 1.5;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease;
        z-index: 5;
      }
      #dialogue.visible { opacity: 1; }

      #dialogue-hint {
        position: absolute;
        right: 16px;
        bottom: 10px;
        color: #e5e5e5;
        animation: blink 1s step-end infinite;
      }
      #dialogue-hint.hidden { display: none; }

      #dialogue-choices {
        display: none;
        gap: 24px;
        margin-top: 10px;
      }
      #dialogue-choices.visible { display: flex; }
      #dialogue-choices .choice {
        color: #9a9a9a;
        letter-spacing: 0.05em;
      }

      /* ── Start screen ──────────────────────────────────── */
      #startscreen {
        position: fixed;
        inset: 0;
        background: #0b0c10;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 20;
        transition: opacity 0.6s ease;
      }
      #startscreen.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      .ss-scanlines {
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          to bottom,
          transparent,
          transparent 2px,
          rgba(0, 0, 0, 0.13) 2px,
          rgba(0, 0, 0, 0.13) 4px
        );
        pointer-events: none;
      }
      .ss-terminal {
        position: relative;
        font-family: 'Courier New', Courier, monospace;
        font-size: 0.85rem;
        line-height: 1.95;
        max-width: 460px;
        width: 100%;
        padding: 0 1.5rem;
      }
      .ss-title {
        color: #c4c4c4;
        font-size: 1rem;
        letter-spacing: 0.24em;
        margin-bottom: 0.15rem;
      }
      .ss-divider {
        color: #252525;
        margin-bottom: 0.75rem;
      }
      .ss-line        { color: #4e4e4e; }
      .ss-line.warn   { color: #7e7e7e; margin-top: 0.4rem; }
      .ss-line.instr  { color: #3f3f3f; }

      #ss-prompt {
        font-family: 'Courier New', Courier, monospace;
        font-size: 0.85rem;
        color: #5e5e5e;
        margin-top: 1.5rem;
        visibility: hidden;
      }
      #ss-prompt.visible { visibility: visible; }

      .blink {
        animation: blink 1.1s step-end infinite;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50%       { opacity: 0; }
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
    </style>
  </head>
  <body>

    <!-- Game canvas + dialogue (p5 injects the canvas into #game-container) -->
    <div id="game-container">
      <div id="dialogue">
        <div id="dialogue-text"></div>
        <div id="dialogue-hint">▼</div>
        <div id="dialogue-choices">
          <span class="choice">[Y] YES</span>
          <span class="choice">[N] NO</span>
        </div>
      </div>
    </div>

    <!-- Start screen -->
    <div id="startscreen">
      <div class="ss-scanlines"></div>
      <div class="ss-terminal">
        <div class="ss-title">LET ME ASK CHARLIE</div>
        <div class="ss-divider">────────────────────────────────────────────</div>
        <div id="ss-lines"></div>
        <div id="ss-prompt">PRESS ANY KEY TO BEGIN<span class="blink">_</span></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
    <script src="./js/audio.js"></script>
    <script src="./js/main.js"></script>

    <script>
      const SS_LINES = [
        { text: '> SHADOW RENDERER.......... OK',    delay: 700 },
        { text: '> AUDIO ENVIRONMENT........ OK',    delay: 500 },
        { text: '> LOCATING CHARLIE......... FOUND', delay: 950, cls: '' },
        { text: '',                                   delay: 300 },
        { text: 'WARNING: DO NOT LET HIM FIND YOU.', delay: 500, cls: 'warn' },
        { text: '',                                   delay: 200 },
        { text: 'WASD OR ARROW KEYS TO MOVE.',        delay: 300, cls: 'instr' },
      ];

      let ssIdx = 0;
      const ssLinesEl  = document.getElementById('ss-lines');
      const ssPromptEl = document.getElementById('ss-prompt');
      const ssEl       = document.getElementById('startscreen');

      function showNextLine() {
        if (ssIdx >= SS_LINES.length) {
          setTimeout(() => {
            ssPromptEl.classList.add('visible');
            document.addEventListener('keydown', onStart, { once: true });
            ssEl.addEventListener('click', onStart,    { once: true });
          }, 500);
          return;
        }
        const { text, cls = '', delay } = SS_LINES[ssIdx++];
        const div = document.createElement('div');
        div.className = 'ss-line' + (cls ? ' ' + cls : '');
        div.textContent = text;
        ssLinesEl.appendChild(div);
        setTimeout(showNextLine, delay);
      }

      function onStart() {
        initAudio();
        ssEl.classList.add('fade-out');
        setTimeout(() => {
          ssEl.style.display = 'none';
          resetGame();
        }, 600);
      }

      setTimeout(showNextLine, 900);
    </script>

  </body>
</html>
